version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. Primary Database (PostgreSQL 16)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: emaios_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: emaios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d emaios_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emaios_net

  # ---------------------------------------------------------
  # 2. Cache & Message Broker (Redis 7)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: emaios_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - emaios_net

  # ---------------------------------------------------------
  # 3. Object Storage (MinIO)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: emaios_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emaios_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  emaios_net:
    driver: bridge